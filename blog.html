<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>My Blog</h1>
    <div class="blog">
        {% for post in posts %}
        <div class="card">
            <h2>
                <a href="{{ url_for('post', post_id=post.id) }}">
                {{ post.title }}
                </a>
            </h2>
            <p>{{ post.content }}</p>
            <p class="author">By: {{ post.username }}</p>
            <button>like</button>
        </div>
      {% endfor %}
    </div>
    <p class="author">By: {{ post.username }}</p>
</body>
</html>
